parameters:

    # Form configuration.
    form.contact.source: '%env(default::string:FORM_CONTACT_SOURCE)%'

    # Webhook configuration.
    form.contact.webhook.url: '%env(default::string:FORM_CONTACT_WEBHOOK_URL)%'
    form.contact.webhook.secret_key: '%env(default::string:FORM_CONTACT_WEBHOOK_SECRET_KEY)%'

    # Captcha configuration.
    captcha.site_key: '%env(default::string:CAPTCHA_SITE_KEY)%'
    captcha.secret_key: '%env(default::string:CAPTCHA_SECRET_KEY)%'

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    Derafu\ContactForm\ContactController: ~

    Derafu\ContactForm\ContactService: ~

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\ContactForm\Translation\ContactFormTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
